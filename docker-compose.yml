services:
  #nodos RVDB
  ravendb-node1:
    image: ravendb/ravendb:latest
    container_name: ravendb1
    ports:
      - "8080:8080"   # Web UI
      - "38888:38888" # TCP (optional)
    environment:
      - RAVEN_Setup_Mode=None
      - RAVEN_License_Eula_Accepted=true
      - RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/stats"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  ravendb-node2:
    image: ravendb/ravendb:latest
    container_name: ravendb2
    ports:
      - "8081:8080"   # Web UI
      - "38889:38888" # TCP (optional)
    environment:
      - RAVEN_Setup_Mode=None
      - RAVEN_License_Eula_Accepted=true
      - RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork
    networks:
      - app-network

  ravendb-node3:
    image: ravendb/ravendb:latest
    container_name: ravendb3
    ports:
      - "8082:8080"   # Web UI
      - "38890:38888" # TCP (optional)
    environment:
      - RAVEN_Setup_Mode=None
      - RAVEN_License_Eula_Accepted=true
      - RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork
    networks:
      - app-network

  #Redis cluster
  redis-node-1:
    image: redis:latest
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7001:6379"
      - "17001:16379"
    networks:
      - app-network

  redis-node-2:
    image: redis:latest
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7002:6379"
      - "17002:16379"
    networks:
      - app-network

  redis-node-3:
    image: redis:latest
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7003:6379"
      - "17003:16379"
    networks:
      - app-network

  redis-cluster-creator:
    image: redis:latest
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    networks:
      - app-network
    entrypoint: >
      sh -c "sleep 5 && redis-cli --cluster create
      redis-node-1:6379 redis-node-2:6379 redis-node-3:6379
      --cluster-replicas 0 --cluster-yes"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "32771:5540"
    networks:
      - app-network

  mongo-node-1:
    image: mongo:7
    container_name: mongo-node-1
    command: ["mongod", "--replSet", "rs0", "--bind_ip", "0.0.0.0"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-node-1-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo-node-2:
    image: mongo:7
    container_name: mongo-node-2
    command: ["mongod", "--replSet", "rs0", "--bind_ip", "0.0.0.0"]
    ports:
      - "27018:27017"
    volumes:
      - mongo-node-2-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo-node-3:
    image: mongo:7
    container_name: mongo-node-3
    command: ["mongod", "--replSet", "rs0", "--bind_ip", "0.0.0.0"]
    ports:
      - "27019:27017"
    volumes:
      - mongo-node-3-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo-setup:
    image: mongo:7
    depends_on:
      mongo-node-1:
        condition: service_healthy
      mongo-node-2:
        condition: service_healthy
      mongo-node-3:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure
    entrypoint:
      - bash
      - -lc
      - |
        mongosh --host mongo-node-1 --quiet --eval '
          try {
            rs.status();
            print("Replica set already initialized");
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [
                { _id: 0, host: "mongo-node-1:27017" },
                { _id: 1, host: "mongo-node-2:27017" },
                { _id: 2, host: "mongo-node-3:27017" }
              ]
            });
            print("Replica set initialized");
          }
        '

        until mongosh --host mongo-node-1 --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do
          echo "Waiting for primary..."
          sleep 2
        done
        echo "Primary is ready."

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
      - "1110:1110"
    networks:
      - app-network

  api:
    build: .
    depends_on:
      ravendb-node1:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo-setup:
        condition: service_completed_successfully
    container_name: api
    environment:
      - PORT=3000
      - RAVENDB_URL=http://ravendb-node1:8080
      - RAVENDB_DB=test
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo-node-1:27017,mongo-node-2:27017,mongo-node-3:27017/?replicaSet=rs0
      - MAILPIT_URL=http://mailpit:8025
      - neo4j_URL=neo4j+s://ec7fd635.databases.neo4j.io
      - neo4j_USER=ec7fd635
      - neo4j_PASSWORD=mbGQQkwyrjdjryadRE5Ah_GAeb81LNy-_G6zxpaFD04
    ports:
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-node-1-data:
  mongo-node-2-data:
  mongo-node-3-data: