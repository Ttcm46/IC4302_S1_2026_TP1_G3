services:
  #nodos RVDB
  ravendb-node1 :
    image: ravendb/ravendb:latest
    container_name: ravendb1
    ports:
      - "8080:8080"   # Web UI
      - "38888:38888" # TCP (optional)
    environment:
      - RAVEN_Setup_Mode=None
      - RAVEN_License_Eula_Accepted=true
      - RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/stats"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    # volumes:
    #  - ravendb_data:/opt/RavenDB/Server/RavenData
  ravendb-node2 :
    image: ravendb/ravendb:latest
    container_name: ravendb2
    ports:
      - "8081:8080"   # Web UI
      - "38889:38888" # TCP (optional)
    environment:
      - RAVEN_Setup_Mode=None
      - RAVEN_License_Eula_Accepted=true
      - RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork
    networks:
      - app-network
  ravendb-node3 :
    image: ravendb/ravendb:latest
    container_name: ravendb3
    ports:
      - "8082:8080"   # Web UI
      - "38890:38888" # TCP (optional)
    environment:
      - RAVEN_Setup_Mode=None
      - RAVEN_License_Eula_Accepted=true
      - RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork
    networks:
      - app-network
    

  #Redis cluster
  redis-node-1:
    image: redis:latest
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7001:6379"
      - "17001:16379"
    
    networks:
      - app-network
  redis-node-2:
    image: redis:latest
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7002:6379"
      - "17002:16379"
    networks:
      - app-network

  redis-node-3:
    image: redis:latest
    networks:
      - app-network
    command: redis-server --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    ports:
      - "7003:6379"
      - "17003:16379"

  redis-cluster-creator:
    image: redis:latest
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    # Wait for nodes to start, then creat
    networks:
      - app-network
    entrypoint: >
      sh -c "sleep 5 && redis-cli --cluster create 
      redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 
      --cluster-replicas 0 --cluster-yes"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
  redisinsight: ##UI
    networks:
      - app-network
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "32771:5540" 
  # neo4j:
  #   image: neo4j:latest
  #   container_name: neo4j
  #   ports:
  #     - "7474:7474" # HTTP
  #     - "7687:7687" # Bolt
  #   environment:
  #     - NEO4J_AUTH=none
  #   networks:
  #     - app-network
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=admin
    networks:
      - app-network
  mailpit:
    image: axllent/mailpit:latest
    ports: 
      - "1025:1025"
      - "8025:8025"
      - "1110:1110"
    networks:
      - app-network
  api:
    build: .
    depends_on:
      ravendb-node1:
        condition: service_healthy
    container_name: api
    environment:
      - PORT=3000
      - RAVENDB_URL=http://ravendb-node1:8080
      - RAVENDB_DB=test
      - REDIS_URL=https://redis:6379
      - MAILPIT_URL=https://mailpit:8025
      - neo4j_URL=neo4j+s://ec7fd635.databases.neo4j.io
      - neo4j_USER=ec7fd635
      - neo4j_PASSWORD=mbGQQkwyrjdjryadRE5Ah_GAeb81LNy-_G6zxpaFD04
    ports:
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

